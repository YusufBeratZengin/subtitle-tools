name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    env:
      # Tests never download models; make any accidental Hugging Face access fail fast.
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package only (zero dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run test suite (standard library unittest, no extras)
        run: python -m unittest discover -s tests

      - name: Install development dependencies
        run: pip install -e ".[dev,yaml]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy src

      - name: Run test suite with coverage
        run: pytest

      - name: CLI smoke test
        run: |
          subtool --version
          subtool transcribe --help
