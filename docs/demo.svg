<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 562" width="780" height="562" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13">
