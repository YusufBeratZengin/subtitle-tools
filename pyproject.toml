[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subtitle-tools"
version = "0.2.0"
description = "A zero-dependency Python CLI and library to convert, fix, and lint subtitle files (SRT, WebVTT, ASS/SSA)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" },
]
maintainers = [
    { name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" },
]
requires-python = ">=3.10"
keywords = [
    "subtitles",
    "srt",
    "webvtt",
    "vtt",
    "ass",
    "ssa",
    "linter",
    "converter",
    "caption",
    "timing",
    "transcription",
    "faster-whisper",
    "whisper",
    "karaoke",
    "turkish",
    "shorts",
    "vertical-video",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: Turkish",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Speech-to-subtitle pipeline (`subtool transcribe`); the core stays dependency-free.
transcribe = ["faster-whisper>=1.1,<2"]
# Bundled ffmpeg for `subtool transcribe --burn` when no system ffmpeg is on PATH.
ffmpeg = ["imageio-ffmpeg>=0.5,<1"]
# YAML style files for `subtool transcribe --style` (JSON needs no extra).
yaml = ["PyYAML>=6,<7"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11,<1",
    "mypy>=1.15,<3",
    "types-PyYAML",
]

[project.scripts]
subtool = "subtitle_tools.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/subtitle-tools"
Documentation = "https://github.com/YusufBeratZengin/subtitle-tools#readme"
Repository = "https://github.com/YusufBeratZengin/subtitle-tools"
Issues = "https://github.com/YusufBeratZengin/subtitle-tools/issues"
Changelog = "https://github.com/YusufBeratZengin/subtitle-tools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -m 'not slow' --cov=subtitle_tools --cov-report=term-missing"
markers = ["slow: explicit local-model smoke tests (never download models)"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "imageio_ffmpeg.*", "yaml.*"]
ignore_missing_imports = true
