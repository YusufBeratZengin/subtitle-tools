[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subtitle-tools"
version = "0.1.0"
description = "A zero-dependency Python CLI and library to convert, fix, and lint subtitle files (SRT, WebVTT, ASS/SSA)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" },
]
maintainers = [
    { name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" },
]
requires-python = ">=3.10"
keywords = [
    "subtitles",
    "srt",
    "webvtt",
    "vtt",
    "ass",
    "ssa",
    "linter",
    "converter",
    "caption",
    "timing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
subtool = "subtitle_tools.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/subtitle-tools"
Documentation = "https://github.com/YusufBeratZengin/subtitle-tools#readme"
Repository = "https://github.com/YusufBeratZengin/subtitle-tools"
Issues = "https://github.com/YusufBeratZengin/subtitle-tools/issues"
Changelog = "https://github.com/YusufBeratZengin/subtitle-tools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=subtitle_tools --cov-report=term-missing"
